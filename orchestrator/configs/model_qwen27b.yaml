# Overlay for the 27B runs (Qwen3.8-27B). Model card, thinking mode: temperature 1.0, top_p 0.95, top_k 20,
# presence_penalty 0.0 for every use. reasoning_effort=medium for all roles (user decision 2026-10-14: at the
# template default, xhigh, every code-writing call thought until its cap). Caps as in the previous 27B runs:
# the code-writing role (here the Generator) 65536, the reasoning roles 24576.
llm:
  model: Qwen/Qwen3.8-27B        # the job overrides this with the model the server actually loaded
sampling:
  default: {temperature: 1.0, top_p: 0.95, top_k: 20, presence_penalty: 0.0, max_tokens: 32768, enable_thinking: true,
            reasoning_effort: medium}
  generator: {max_tokens: 65536}
  estimator: {max_tokens: 24576}
  librarian: {max_tokens: 24576}
eval:
  backend: judge
