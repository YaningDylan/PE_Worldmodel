# Conditions. Only `loop` keys differ; the Generator prompt is the same in all of them.
vanilla:       # OpenEvolve-style search, one candidate per iteration
  loop: {N: 1, select: single, use_estimator: false, update_rule: never, eval_all: false}
pe:            # N candidates -> stage 1 -> Estimator (reads B) -> argmax delta_hat; Librarian updates B
  loop: {N: 4, select: argmax, use_estimator: true, update_rule: error, eval_all: false}
pe_labeled:    # pe + full evaluation of every stage-1 passer and empty-B estimates (logged, not used)
  loop: {N: 4, select: argmax, use_estimator: true, update_rule: error, eval_all: true}
random_of_n:   # N candidates -> stage 1 -> uniform choice among passers
  loop: {N: 4, select: random, use_estimator: false, update_rule: never, eval_all: false}
wm_nob:        # pe with B kept empty and the Librarian disabled
  loop: {N: 4, select: argmax, use_estimator: true, update_rule: never, eval_all: false}
